<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 13 Day 5 - CSS Animations</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      background: #f4f4f4;
    }

    /* Common style */
    body > div {
      width: 483px;
      height: 298px;
      background: #676470;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      border-radius: 8px;
    }

    /* 1. Fade */
    .fade {
      opacity: 0.5;
    }
    .fade:hover {
      opacity: 1;
    }

    /* 2. Color change */
    .color:hover {
      background: #53a7ea;
    }

    /* 3. Grow */
    .grow:hover {
      transform: scale(1.3);
    }

    /* 4. Shrink */
    .shrink:hover {
      transform: scale(0.8);
    }

    /* 5. Rotate */
    .rotate:hover {
      transform: rotateZ(-30deg);
    }

    /* 6. Circle */
    .circle:hover {
      border-radius: 50%;
    }

    /* 7. 3D shadow */
    .threed:hover {
      box-shadow:
        1px 1px #53a7ea,
        2px 2px #53a7ea,
        3px 3px #53a7ea;
      transform: translateX(-3px);
    }

    /* 8. Swing */
    @keyframes swing {
      15% { transform: translateX(5px); }
      30% { transform: translateX(-5px); }
      50% { transform: translateX(3px); }
      65% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
      100% { transform: translateX(0); }
    }

    .swing:hover {
      animation: swing 1s ease;
      animation-iteration-count: 1;
    }

    /* 9. Inset border effect */
    .border:hover {
      box-shadow: inset 0 0 0 25px #53a7ea;
    }

  </style>
</head>
<body>

  <div class="fade">Fade</div>
  <div class="color">Color</div>
  <div class="grow">Grow</div>
  <div class="shrink">Shrink</div>
  <div class="rotate">Rotate</div>
  <div class="circle">Circle</div>
  <div class="threed">3D</div>
  <div class="swing">Swing</div>
  <div class="border">Inset Border</div>

</body>
</html>
